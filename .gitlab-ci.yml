stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .npm/

backend-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgis/postgis:16-3.4
      alias: db
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: servicehome
    POSTGRES_USER: servicehome
    POSTGRES_PASSWORD: servicehome
    DB_NAME: servicehome
    DB_USER: servicehome
    DB_PASSWORD: servicehome
    DB_HOST: db
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ci-test-secret-key-very-secure-32bytes-min
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libpq-dev gcc
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py test

frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci || npm install
    - npm run build
  artifacts:
    name: "frontend-dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - frontend/dist/
