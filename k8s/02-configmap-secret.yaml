apiVersion: v1
kind: ConfigMap
metadata:
  name: servicehome-config
  namespace: servicehome
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,servicehome.local,*"
  DB_NAME: "servicehome"
  DB_USER: "servicehome"
  DB_HOST: "postgres-postgis"
  DB_PORT: "5432"
  REDIS_URL: "redis://redis:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: servicehome-secret
  namespace: servicehome
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "k8s-prod-servicehome-secret-key-2026"
  DB_PASSWORD: "servicehome"
