stages:
  - test
  - build

backend-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgis/postgis:16-3.4
      alias: db
  variables:
    POSTGRES_DB: servicehome
    POSTGRES_USER: servicehome
    POSTGRES_PASSWORD: servicehome
    DB_NAME: servicehome
    DB_USER: servicehome
    DB_PASSWORD: servicehome
    DB_HOST: db
    REDIS_URL: redis://localhost:6379/0
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libpq-dev gcc
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py test

frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci || npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
