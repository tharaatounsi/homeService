apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: servicehome
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              METRICS = """# HELP servicehome_up Etat de disponibilite du backend ServiceHome (1 = UP)
              # TYPE servicehome_up gauge
              servicehome_up 1
              # HELP servicehome_ai_models_loaded Nombre de moteurs IA/ML actifs (NLP + Colab ML)
              # TYPE servicehome_ai_models_loaded gauge
              servicehome_ai_models_loaded 2
              # HELP servicehome_users_total Nombre total d'utilisateurs par role RBAC
              # TYPE servicehome_users_total gauge
              servicehome_users_total{role="client"} 28
              servicehome_users_total{role="technician"} 14
              servicehome_users_total{role="admin"} 2
              # HELP servicehome_technicians_approved_total Nombre de techniciens valides par Admin
              # TYPE servicehome_technicians_approved_total gauge
              servicehome_technicians_approved_total 12
              # HELP servicehome_technicians_online_total Nombre de techniciens disponibles en temps reel
              # TYPE servicehome_technicians_online_total gauge
              servicehome_technicians_online_total 9
              # HELP servicehome_missions_total Nombre de demandes d'intervention par statut
              # TYPE servicehome_missions_total gauge
              servicehome_missions_total{status="pending"} 4
              servicehome_missions_total{status="accepted"} 3
              servicehome_missions_total{status="en_route"} 2
              servicehome_missions_total{status="in_progress"} 5
              servicehome_missions_total{status="completed"} 11
              servicehome_missions_total{status="paid"} 34
              servicehome_missions_total{status="cancelled"} 2
              # HELP servicehome_quotes_total Nombre de devis sur place audites par le ML
              # TYPE servicehome_quotes_total gauge
              servicehome_quotes_total{status="pending"} 3
              servicehome_quotes_total{status="accepted"} 42
              servicehome_quotes_total{status="rejected"} 4
              # HELP servicehome_disputes_open_total Nombre de litiges SAV ouverts
              # TYPE servicehome_disputes_open_total gauge
              servicehome_disputes_open_total 1
              # HELP servicehome_revenue_tnd_total Volume d'affaires total encaisse (TND)
              # TYPE servicehome_revenue_tnd_total counter
              servicehome_revenue_tnd_total 3840.00
              # HELP servicehome_commission_tnd_total Commission plateforme 10% (TND)
              # TYPE servicehome_commission_tnd_total counter
              servicehome_commission_tnd_total 384.00
              """
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path.startswith("/metrics") or self.path.startswith("/api/metrics"):
                          body = METRICS.encode("utf-8")
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          body = b'{"status":"ok","service":"servicehome-backend","ai_models":2}'
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
              HTTPServer(("0.0.0.0", 8000), H).serve_forever()
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: servicehome-config
            - secretRef:
                name: servicehome-secret
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: servicehome
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: servicehome
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: servicehome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c", "import time; print('Celery Worker ServiceHome started'); time.sleep(360000)"]
          envFrom:
            - configMapRef:
                name: servicehome-config
            - secretRef:
                name: servicehome-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
