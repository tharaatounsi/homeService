global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "servicehome-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          application: "servicehome"
          environment: "production"
          stack: "django-postgis-channels-ai"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
